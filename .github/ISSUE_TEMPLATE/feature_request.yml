name: Feature request
description: Propose a new feature or improvement
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api
        - db
        - queue
        - redis
        - realtime
        - frontend
        - testing
        - auth
        - observability
        - infra
        - cicd
        - architecture
    validations:
      required: false
