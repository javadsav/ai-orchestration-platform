services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npm run dev"
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  frontend_node_modules:
  frontend_next_cache:
